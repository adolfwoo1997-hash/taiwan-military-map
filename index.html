<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台湾军事设施分布图．开源情报</title>
<meta name="description" content="台湾军事设施分布图，439 笔公开资料汇整，含精度分级与资料来源。">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --bg:#0B0F14;
  --bg-2:#0F1621;
  --panel:rgba(15,22,33,.88);
  --panel-solid:#0F1621;
  --line:#1F2D3D;
  --line-2:#16222F;
  --txt:#FFFFFF;
  --txt-2:#94A3B8;
  --txt-3:#5B6B80;
  --cyan:#20A0D8;
  --cyan-2:#00C0EF;
  --green:#2ECB71;
  --gold:#F0A020;
  --red:#E64C5A;
  --purple:#9B59B6;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--txt);overflow:hidden;
  font-family:Inter,"PingFang SC","Noto Sans SC","Microsoft YaHei",-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
#top{
  position:fixed;top:0;left:0;right:0;height:54px;z-index:1200;
  background:rgba(11,15,20,.94);border-bottom:1px solid var(--line);
  display:flex;align-items:center;padding:0 18px;backdrop-filter:blur(8px);
}
.mark{width:26px;height:26px;border:1px solid var(--cyan);position:relative;margin-right:12px;flex:0 0 26px}
.mark::before,.mark::after{content:"";position:absolute;background:var(--cyan)}
.mark::before{left:50%;top:4px;bottom:4px;width:1px;transform:translateX(-.5px)}
.mark::after{top:50%;left:4px;right:4px;height:1px;transform:translateY(-.5px)}
#top h1{font-size:15.5px;font-weight:700;letter-spacing:.02em;margin:0;line-height:1.2;white-space:nowrap}
#top h1 small{display:block;font-size:8.5px;letter-spacing:.18em;color:var(--txt-3);font-weight:500;margin-top:2px}
#metrics{margin-left:auto;display:flex;align-items:center;gap:26px}
.metric{text-align:right;line-height:1.1}
.metric b{display:block;font-size:18px;font-weight:700}
.metric span{font-size:9px;letter-spacing:.12em;color:var(--txt-3)}
#q{
  width:190px;margin-left:26px;padding:7px 11px;font-size:12px;
  background:rgba(15,22,33,.9);border:1px solid var(--line);border-radius:6px;
  color:var(--txt);font-family:inherit;outline:none;
}
#q::placeholder{color:var(--txt-3)}
#q:focus{border-color:var(--cyan)}

/* ---------- map ---------- */
#map{position:fixed;inset:54px 0 0 0;background:var(--bg)}
.leaflet-container{background:var(--bg);font-family:inherit}
.leaflet-control-attribution{background:rgba(11,15,20,.75)!important;color:#3E4C5E!important;font-size:9px!important}
.leaflet-control-attribution a{color:#54677E!important}
.leaflet-bar{border:1px solid var(--line)!important;border-radius:6px!important;overflow:hidden}
.leaflet-bar a{background:rgba(15,22,33,.92)!important;color:var(--txt-2)!important;border-color:var(--line)!important;width:28px!important;height:28px!important;line-height:28px!important}
.leaflet-bar a:hover{background:#16222F!important;color:#fff!important}

/* ---------- floating sidebar ---------- */
#side{
  position:fixed;top:70px;left:16px;width:238px;z-index:1100;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
  backdrop-filter:blur(10px);box-shadow:0 12px 40px rgba(0,0,0,.45);
  display:flex;flex-direction:column;max-height:calc(100vh - 150px);
}
#side .hd{
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 13px;border-bottom:1px solid var(--line-2);
  font-size:11px;letter-spacing:.14em;color:var(--txt-2);
}
#side .hd b{color:var(--txt);font-weight:600;letter-spacing:.06em}
#side .hd button{background:none;border:0;color:var(--cyan);font-size:10px;cursor:pointer;font-family:inherit;padding:0}
#cats{overflow-y:auto;padding:6px 0 8px}
.cat{
  display:flex;align-items:center;gap:9px;padding:5px 13px;cursor:pointer;
  font-size:12px;color:var(--txt-2);transition:background .12s;
}
.cat:hover{background:rgba(32,160,216,.08)}
.cat .dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.cat .n{margin-left:auto;font-size:10px;color:var(--txt-3);
  background:rgba(255,255,255,.05);border-radius:3px;padding:1px 5px;min-width:22px;text-align:center}
.cat.off{opacity:.3}
.cat.off .dot{background:#3E4C5E!important}
#side .ft{border-top:1px solid var(--line-2);padding:9px 13px;font-size:9.5px;line-height:1.6;color:var(--txt-3)}

/* ---------- bottom ---------- */
#pill{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:1100;
  background:rgba(15,22,33,.92);border:1px solid var(--line);border-radius:20px;
  padding:6px 16px;font-size:11.5px;color:var(--txt-2);letter-spacing:.04em;
  display:flex;align-items:center;gap:8px;backdrop-filter:blur(8px);
}
#pill i{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
#pill b{color:#fff;font-weight:600}
#credit{
  position:fixed;bottom:12px;right:16px;z-index:1100;font-size:9.5px;color:var(--txt-3);
  letter-spacing:.03em;text-align:right;line-height:1.5;
}
#credit b{color:var(--txt-2);font-weight:500}
#credit .who{display:flex;align-items:center;justify-content:flex-end;gap:8px}
#credit img{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);object-fit:cover;display:block}

/* view switch */
#tools{position:fixed;top:70px;right:16px;z-index:1100;display:flex;
  border:1px solid var(--line);border-radius:6px;overflow:hidden;background:rgba(15,22,33,.9)}
#tools button{font-family:inherit;font-size:11px;letter-spacing:.08em;padding:6px 12px;
  background:none;border:0;color:var(--txt-2);cursor:pointer;border-right:1px solid var(--line)}
#tools button:last-child{border-right:0}
#tools button.on{background:var(--cyan);color:#04121A}

body.listmode #side{display:none}
#mask{position:fixed;inset:54px 0 0 0;background:rgba(4,8,12,.5);z-index:1290;display:none}
#mask.on{display:block}
/* ---------- drawer ---------- */
#drawer{
  position:fixed;top:54px;right:0;height:calc(100% - 54px);width:392px;max-width:94vw;z-index:1300;
  background:rgba(13,19,27,.97);border-left:1px solid var(--line);
  transform:translateX(102%);transition:transform .26s cubic-bezier(.2,.7,.2,1);
  display:flex;flex-direction:column;backdrop-filter:blur(14px);
}
#drawer.open{transform:none}
#drawer .dh{padding:20px 22px 14px;border-bottom:1px solid var(--line);position:relative}
#drawer .dc{font-size:10px;letter-spacing:.16em;color:var(--cyan)}
#drawer .dn{font-size:20px;font-weight:700;line-height:1.35;margin:8px 0 2px;padding-right:34px}
#close{position:absolute;top:16px;right:16px;width:26px;height:26px;border:1px solid var(--line);
  background:none;cursor:pointer;color:var(--txt-2);font-size:14px;line-height:1;border-radius:5px;font-family:inherit}
#close:hover{background:#16222F;color:#fff}
#drawer .db{padding:8px 22px 30px;overflow-y:auto;font-size:12.5px;line-height:1.75}
.row{display:grid;grid-template-columns:70px 1fr;gap:10px 12px;padding:10px 0;border-bottom:1px solid var(--line-2)}
.row:last-of-type{border-bottom:0}
.k{color:var(--txt-3);font-size:10px;letter-spacing:.1em;padding-top:3px}
.v{color:#DCE3EB}
.coord{margin-top:16px;padding:12px 14px;background:#0A1017;border:1px solid var(--line);border-radius:6px;line-height:1.9}
.coord .big{font-size:14.5px;color:#fff}
.coord .dms{font-size:10px;color:var(--txt-3);margin-top:3px}
.grade{display:inline-block;margin-top:8px;padding:2px 8px;border:1px solid var(--line);
  border-radius:3px;font-size:9.5px;letter-spacing:.06em;color:var(--txt-2)}

/* ---------- list ---------- */
#list{position:fixed;inset:54px 0 0 0;background:var(--bg);overflow-y:auto;display:none;z-index:1050}
#list.on{display:block}
#list table{width:100%;border-collapse:collapse;font-size:12px}
#list th{position:sticky;top:0;background:#0B0F14;text-align:left;font-weight:600;
  font-size:9.5px;letter-spacing:.14em;color:var(--txt-3);padding:12px 16px;border-bottom:1px solid var(--line)}
#list td{padding:9px 16px;border-bottom:1px solid var(--line-2);color:var(--txt-2)}
#list tr:hover td{background:rgba(32,160,216,.07);cursor:pointer}
#list .num{color:var(--txt-3);font-size:10px;width:44px}
#list .nm{color:#E6ECF3;font-weight:500}
#list .cat-cell{white-space:nowrap;font-size:11px}

.tt{background:rgba(11,15,20,.96)!important;border:1px solid var(--line)!important;
  color:#E6ECF3!important;font-size:11px!important;padding:4px 8px!important;
  border-radius:4px!important;box-shadow:0 4px 16px rgba(0,0,0,.5)!important}
.tt::before{display:none!important}

@media (max-width:900px){
  #metrics{display:none}
  #q{width:130px;margin-left:12px}
  #side{width:calc(100% - 32px);max-height:42vh;top:auto;bottom:64px}
  #drawer{width:100%;top:54px}
  #credit{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="top">
  <div class="mark"></div>
  <h1>台湾军事设施分布图<small>TAIWAN MILITARY BASES · OPEN SOURCE</small></h1>
  <div id="metrics">
    <div class="metric"><b id="mTot">414</b><span>设施</span></div>
    <div class="metric"><b id="mPrec">182</b><span>精确点</span></div>
    <div class="metric"><b id="mCat">13</b><span>类别</span></div>
    <div class="metric"><b id="mCty">22</b><span>县市</span></div>
    <input id="q" type="search" placeholder="搜索名称 / 单位 / 县市" autocomplete="off">
  </div>
</div>

<div id="map"></div>

<aside id="side">

  <div id="cats"></div>
  <div class="ft">圆点为实测或地址级，小点为推定。虚线空心圆为驻地所在地坐标，台军导弹部队多为机动部署，无法实时给出具体坐标。</div>
</aside>

<div id="tools"><button id="btnMap" class="on">地图</button><button id="btnList">清单</button></div>

<div id="credit"><div class="who"><img src="avatar.png" alt="制作"><div><b>制作</b> 李渤瀚　2026.11</div></div></div>

<div id="list"><table><thead><tr><th class="num">#</th><th>名称</th><th>类别</th><th>位置</th><th>精度</th></tr></thead><tbody id="tbody"></tbody></table></div>

<div id="mask"></div>
<section id="drawer" aria-hidden="true">
  <div class="dh">
    <div class="dc" id="dCat">—</div>
    <div class="dn" id="dName">—</div>
    <button id="close" aria-label="关闭">×</button>
  </div>
  <div class="db">
    <div class="row"><div class="k">位置</div><div class="v" id="dLoc">—</div></div>
    <div class="row"><div class="k">部队</div><div class="v" id="dUnit">—</div></div>
    <div class="row"><div class="k">备注</div><div class="v" id="dNote">—</div></div>
    <div class="row"><div class="k">依据</div><div class="v" id="dBasis">—</div></div>
    <div class="row"><div class="k">精度</div><div class="v" id="dGrade">—</div></div>
    <div class="coord mono">
      <div class="big"><span id="dLat">—</span>°N　<span id="dLon">—</span>°E</div>
      <div class="dms" id="dDms">—</div>
    </div>
  </div>
</section>

2ECB71","指挥机构":"#9B59B6","后备与厂库":"#A855F7","宪兵":"#E64C5A","军事院校":"#4C7DF0","离岛据点":"#00C0EF","导弹阵地":"#F0503C","战区与联队":"#7A8FA6","战史据点":"#5B6B80","美军相关（非基地）":"#FFD166","资通电军":"#2ED3C6"}}</script>
<script>
(function(){
  var D=JSON.parse(document.getElementById('data').textContent);
  var PTS=D.pts, COLOR=D.colors;

  var map=L.map('map',{zoomControl:false,minZoom:5,maxZoom:18,zoomSnap:.25,worldCopyJump:true});
  L.control.zoom({position:'bottomright'}).addTo(map);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',{
    maxZoom:19,maxNativeZoom:16,
    attribution:'&copy; Esri, HERE, Garmin, &copy; OpenStreetMap contributors'
  }).addTo(map);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}',{
    maxZoom:19,maxNativeZoom:16,pane:'overlayPane',opacity:.8
  }).addTo(map);
  map.fitBounds([[21.80,118.00],[26.45,122.10]],{padding:[6,6]});

  var layer=L.layerGroup().addTo(map);
  var names=Object.keys(COLOR), on={};
  names.forEach(function(c){on[c]=true;});

  var catsEl=document.getElementById('cats');
  names.forEach(function(c){
    var n=PTS.filter(function(p){return p.c===c;}).length;
    var d=document.createElement('div');
    d.className='cat'; d.dataset.cat=c;
    d.innerHTML='<i class="dot" style="background:'+COLOR[c]+';box-shadow:0 0 7px '+COLOR[c]+'"></i>'+
                '<span>'+c+'</span><span class="n mono">'+n+'</span>';
    d.addEventListener('click',function(){ on[c]=!on[c]; d.classList.toggle('off',!on[c]); render(); });
    catsEl.appendChild(d);
  });
  document.getElementById('catAll').addEventListener('click',function(){
    var anyOff=names.some(function(k){return !on[k];});
    names.forEach(function(k){on[k]=anyOff;});
    [].forEach.call(catsEl.children,function(el){el.classList.toggle('off',!on[el.dataset.cat]);});
    render();
  });

  var qEl=document.getElementById('q'); qEl.addEventListener('input',function(){render(); if(document.getElementById('list').classList.contains('on')) buildList();});

  var NOMAP={'S6':1,'D':1};
  function grp(g){return (g||'').split('-')[0];}
  function match(p){
    if(!on[p.c]) return false;
    var q=qEl.value.trim().toLowerCase();
    if(!q) return true;
    return (p.n+' '+p.u+' '+p.cy+' '+p.t+' '+p.c).toLowerCase().indexOf(q)>=0;
  }

  function render(){
    layer.clearLayers();
    var vis=0,prec=0;
    PTS.forEach(function(p){
      if(!match(p)) return;
      vis++; if(/^(S1|S2|S3|R1|R2)$/.test(grp(p.g))) prec++;
      var col=COLOR[p.c]||'#888';
      var g=grp(p.g);
      if(g==='S6'||g==='D'){
        var h=L.circleMarker([p.y,p.x],{radius:6.5,color:col,weight:1.1,opacity:.95,dashArray:'2.5,3',fill:false});
        h.bindTooltip(p.n+'｜代表点，非实际位置',{direction:'top',offset:[0,-5],className:'tt'});
        h.on('click',function(){open(p);});
        layer.addLayer(h);
        return;
      }
      var small=/^(S4|E)$/.test(g);
      var halo=L.circleMarker([p.y,p.x],{radius:small?7:9,stroke:false,fillColor:col,fillOpacity:.16,interactive:false});
      var dot=L.circleMarker([p.y,p.x],{radius:small?2.6:3.4,color:'#0B0F14',weight:.6,fillColor:col,fillOpacity:1});
      dot.bindTooltip(p.n,{direction:'top',offset:[0,-4],className:'tt'});
      dot.on('click',function(){open(p);});
      layer.addLayer(halo); layer.addLayer(dot);
    });
    document.getElementById('sVis').textContent=vis;
    document.getElementById('mPrec').textContent=prec;
  }

  document.getElementById('mTot').textContent=PTS.length;
  document.getElementById('mCat').textContent=names.length;
  var cty={}; PTS.forEach(function(p){ if(p.cy&&p.cy!=='—'&&p.cy.indexOf('、')<0) cty[p.cy]=1;});
  document.getElementById('mCty').textContent=Object.keys(cty).length;

  var drawer=document.getElementById('drawer');
  var GL={S1:'实点',S2:'地址级门牌',S3:'机场基准点',R1:'别名点',R2:'街道门牌级',S4:'地标定位',S6:'县市定位',E:'历史／非军事',D:'区域定位'};
  function dm(v,pos,neg){
    var h=v>=0?pos:neg,a=Math.abs(v),d=Math.floor(a),m=Math.floor((a-d)*60),s=((a-d)*60-m)*60;
    return h+' '+d+'°'+m+"'"+s.toFixed(1)+'"';
  }
  function open(p){
    document.getElementById('dCat').textContent=p.c;
    document.getElementById('dName').textContent=p.n;
    document.getElementById('dLoc').textContent=((p.cy&&p.cy!=='—')?p.cy:'')+((p.t&&p.t!=='—')?' '+p.t:'')||'—';
    document.getElementById('dUnit').textContent=p.u||'—';
    var nt=(p.no&&['None','none','null'].indexOf(String(p.no).trim())<0)?p.no:'';
    document.getElementById('dNote').textContent=nt||'无备注';
    document.getElementById('dBasis').textContent=p.b||p.g;
    var ee=p.e,ev=(ee==null||isNaN(ee))?'—':(ee>=1000?((ee/1000).toFixed(ee%1000?1:0))+' km':Math.round(ee)+' m');
    document.getElementById('dGrade').textContent=(GL[grp(p.g)]||p.g)+'　±'+ev;
    document.getElementById('dLat').textContent=p.y.toFixed(5);
    document.getElementById('dLon').textContent=p.x.toFixed(5);
    document.getElementById('dDms').textContent=dm(p.y,'N','S')+'　'+dm(p.x,'E','W');
    drawer.classList.add('open'); drawer.setAttribute('aria-hidden','false');
    mask.classList.add('on');
    if(!document.body.classList.contains('listmode')) map.flyTo([p.y,p.x],Math.max(map.getZoom(),11),{duration:.55});
  }
  var mask=document.getElementById('mask');
  function shut(){
    drawer.classList.remove('open'); drawer.setAttribute('aria-hidden','true');
    mask.classList.remove('on');
  }
  document.getElementById('close').addEventListener('click',shut);
  mask.addEventListener('click',shut);
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'||e.key==='Esc') shut(); });

  var tbody=document.getElementById('tbody');
  function buildList(){
    tbody.innerHTML='';
    PTS.forEach(function(p){
      if(!match(p)) return;
      var tr=document.createElement('tr');
      tr.innerHTML='<td class="num mono">'+p.i+'</td><td class="nm">'+p.n+'</td><td class="cat-cell">'+p.c+'</td>'+
        '<td>'+((p.cy&&p.cy!=='—')?p.cy:'')+((p.t&&p.t!=='—')?' '+p.t:'')+'</td>'+
        '<td class="mono" style="font-size:10px;color:#5B6B80">'+grp(p.g)+'</td>';
      tr.addEventListener('click',function(){open(p);});
      tbody.appendChild(tr);
    });
  }
  document.getElementById('btnList').addEventListener('click',function(){
    document.getElementById('list').classList.add('on');
    document.body.classList.add('listmode');
    this.classList.add('on'); document.getElementById('btnMap').classList.remove('on'); buildList();
  });
  document.getElementById('btnMap').addEventListener('click',function(){
    document.getElementById('list').classList.remove('on');
    document.body.classList.remove('listmode');
    this.classList.add('on'); document.getElementById('btnList').classList.remove('on');
  });

  render();
})();
</script>
<script>
(function(){var d=JSON.parse(document.getElementById('data').textContent),n=d.pts.length;
var rep=d.pts.filter(function(p){return /^(S6|D)/.test(p.g||'')}).length;
['mTot','sTot'].forEach(function(id){var el=document.getElementById(id);if(!el)return;
el.textContent=n;new MutationObserver(function(){if(el.textContent!==String(n))el.textContent=n;})
.observe(el,{childList:true,characterData:true,subtree:true});});
var off=document.getElementById('sOff');if(off)off.textContent='其中 '+rep+' 笔为代表点';})();
</script>
</body>
</html>
